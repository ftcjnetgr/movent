name: One-time code formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Format TypeScript and CSS
        run: |
          npx --yes prettier@3.6.2 --write \
            "app/**/*.ts" \
            "app/**/*.tsx" \
            "components/**/*.tsx" \
            "lib/**/*.ts" \
            "proxy.ts" \
            "next.config.ts" \
            "app/**/*.css"

      - name: Commit formatting or remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            git rm .github/workflows/format-once.yml
            git commit -m "chore: remove temporary formatter workflow"
          else
            git add app components lib proxy.ts next.config.ts .github/workflows/format-once.yml
            git commit -m "chore: format source code"
          fi

          git push
