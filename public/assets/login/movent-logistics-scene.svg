<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" fill="none">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="1000" y2="650" gradientUnits="userSpaceOnUse">
    <stop stop-color="#0B2543"/><stop offset=".48" stop-color="#214A72"/><stop offset=".78" stop-color="#8A5B58"/><stop offset="1" stop-color="#E58B62"/>
  </linearGradient>
  <linearGradient id="ground" x1="620" y1="510" x2="620" y2="900" gradientUnits="userSpaceOnUse">
    <stop stop-color="#243B51"/><stop offset=".48" stop-color="#101F30"/><stop offset="1" stop-color="#06111D"/>
  </linearGradient>
  <linearGradient id="warehouse" x1="480" y1="230" x2="1100" y2="610" gradientUnits="userSpaceOnUse">
    <stop stop-color="#173A5C"/><stop offset="1" stop-color="#071827"/>
  </linearGradient>
  <linearGradient id="glass" x1="600" y1="300" x2="1120" y2="570" gradientUnits="userSpaceOnUse">
    <stop stop-color="#315B7E"/><stop offset="1" stop-color="#0B2135"/>
  </linearGradient>
  <linearGradient id="truck" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#F4F6F7"/><stop offset="1" stop-color="#B9C4CB"/>
  </linearGradient>
  <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#B9A27C"/><stop offset="1" stop-color="#715B40"/>
  </linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<!-- sky and distant city -->
<rect width="1200" height="900" fill="url(#sky)"/>
<circle cx="870" cy="330" r="180" fill="#FFB078" opacity=".18" filter="url(#soft)"/>
<path d="M0 475L95 405L175 442L255 372L350 420L455 342L560 414L690 350L815 425L945 365L1200 455V620H0V475Z" fill="#18344D" opacity=".72"/>
<g fill="#10273D" opacity=".82">
  <rect x="40" y="505" width="35" height="95"/><rect x="83" y="470" width="54" height="130"/>
  <rect x="148" y="500" width="38" height="100"/><rect x="195" y="455" width="62" height="145"/>
  <rect x="270" y="515" width="48" height="85"/><rect x="330" y="480" width="42" height="120"/>
</g>
<g fill="#F0B36A" opacity=".35">
  <rect x="92" y="488" width="5" height="8"/><rect x="105" y="488" width="5" height="8"/>
  <rect x="211" y="474" width="6" height="9"/><rect x="228" y="474" width="6" height="9"/>
</g>

<!-- ground -->
<rect y="585" width="1200" height="315" fill="url(#ground)"/>
<path d="M0 720L510 585H1200V900H0V720Z" fill="#0A1A2A"/>
<path d="M0 795L570 585" stroke="#5A7184" stroke-opacity=".28" stroke-width="2"/>
<path d="M210 900L690 585" stroke="#5A7184" stroke-opacity=".22" stroke-width="2"/>
<path d="M620 900L870 585" stroke="#5A7184" stroke-opacity=".18" stroke-width="2"/>
<path d="M915 900L1080 585" stroke="#5A7184" stroke-opacity=".18" stroke-width="2"/>

<!-- warehouse -->
<path d="M405 270L1070 172L1195 260V625H405V270Z" fill="url(#warehouse)"/>
<path d="M405 270L1070 172L1195 260L535 350L405 320V270Z" fill="#102D49"/>
<path d="M535 350L1195 260V625H535V350Z" fill="#071827"/>
<path d="M575 355L1155 278V605H575V355Z" fill="url(#glass)" opacity=".72"/>
<g stroke="#88A4BA" opacity=".16">
  <path d="M575 420H1155M575 485H1155M575 550H1155"/>
  <path d="M690 340V605M805 325V605M920 310V605M1035 295V605M1125 283V605"/>
</g>

<!-- logistics brand-color architectural stripe, no external branding -->
<path d="M535 349L1195 260V284L535 373V349Z" fill="#D71920"/>
<path d="M535 373L1195 284V297L535 386V373Z" fill="#0054A6"/>

<!-- loading bays -->
<g>
  <g fill="#061522" stroke="#557087" stroke-width="2">
    <rect x="615" y="408" width="96" height="150" rx="5"/>
    <rect x="735" y="392" width="96" height="150" rx="5"/>
    <rect x="855" y="376" width="96" height="150" rx="5"/>
    <rect x="975" y="360" width="96" height="150" rx="5"/>
  </g>
  <g fill="#F2C16F" opacity=".72">
    <rect x="631" y="423" width="64" height="6" rx="3"/>
    <rect x="751" y="407" width="64" height="6" rx="3"/>
    <rect x="871" y="391" width="64" height="6" rx="3"/>
    <rect x="991" y="375" width="64" height="6" rx="3"/>
  </g>
  <g fill="#D9E1E7" opacity=".55" font-family="Arial" font-size="19" font-weight="700">
    <text x="651" y="457">01</text><text x="771" y="441">02</text>
    <text x="891" y="425">03</text><text x="1011" y="409">04</text>
  </g>
</g>

<!-- dock lights -->
<g fill="#FFD27C" opacity=".8" filter="url(#glow)">
  <circle cx="640" cy="390" r="7"/><circle cx="760" cy="374" r="7"/>
  <circle cx="880" cy="358" r="7"/><circle cx="1000" cy="342" r="7"/>
</g>
<g fill="#FFE0A2" opacity=".9">
  <rect x="632" y="387" width="16" height="3" rx="2"/><rect x="752" y="371" width="16" height="3" rx="2"/>
  <rect x="872" y="355" width="16" height="3" rx="2"/><rect x="992" y="339" width="16" height="3" rx="2"/>
</g>

<!-- distant trucks -->
<g opacity=".72">
  <g transform="translate(105 566)">
    <rect x="0" y="22" width="82" height="34" rx="5" fill="#CBD5DB"/>
    <rect x="70" y="30" width="29" height="26" rx="5" fill="#AEBBC3"/>
    <circle cx="24" cy="59" r="9" fill="#07111B"/><circle cx="78" cy="59" r="9" fill="#07111B"/>
  </g>
  <g transform="translate(205 553) scale(.82)">
    <rect x="0" y="22" width="82" height="34" rx="5" fill="#D6DDE1"/>
    <rect x="70" y="30" width="29" height="26" rx="5" fill="#B7C2C9"/>
    <circle cx="24" cy="59" r="9" fill="#07111B"/><circle cx="78" cy="59" r="9" fill="#07111B"/>
  </g>
</g>

<!-- main delivery truck -->
<g transform="translate(455 550)">
  <rect x="0" y="10" width="310" height="116" rx="8" fill="url(#truck)"/>
  <path d="M310 54H368L395 84V126H310V54Z" fill="#C8D2D8"/>
  <path d="M334 65H362L381 87H334V65Z" fill="#29475E"/>
  <path d="M14 25H296V101H14V25Z" fill="#E8ECEE" opacity=".5"/>
  <rect x="110" y="42" width="92" height="5" rx="2" fill="#D71920" opacity=".9"/>
  <rect x="110" y="49" width="92" height="4" rx="2" fill="#0054A6" opacity=".9"/>
  <circle cx="58" cy="131" r="25" fill="#08131E"/><circle cx="58" cy="131" r="12" fill="#657684"/>
  <circle cx="342" cy="131" r="25" fill="#08131E"/><circle cx="342" cy="131" r="12" fill="#657684"/>
  <rect x="318" y="94" width="30" height="10" rx="4" fill="#F7C46B"/>
</g>

<!-- forklift -->
<g transform="translate(835 540)">
  <rect x="0" y="55" width="83" height="56" rx="8" fill="#D6A52D"/>
  <rect x="20" y="24" width="48" height="42" rx="7" fill="#E0AF32"/>
  <path d="M66 20V100M76 20V100M86 20V100" stroke="#D9E0E5" stroke-width="5"/>
  <path d="M86 91H138" stroke="#D9E0E5" stroke-width="7"/>
  <circle cx="22" cy="116" r="14" fill="#08131E"/><circle cx="72" cy="116" r="14" fill="#08131E"/>
  <path d="M19 25L10 2" stroke="#202E38" stroke-width="7"/>
</g>

<!-- pallets and cargo foreground -->
<g transform="translate(735 735)">
  <rect x="0" y="46" width="112" height="16" rx="3" fill="#6B4E33"/>
  <rect x="9" y="0" width="47" height="48" rx="3" fill="url(#box)"/>
  <rect x="59" y="8" width="45" height="40" rx="3" fill="#8C7655"/>
  <path d="M0 62H112" stroke="#B7834B" stroke-width="8"/>
</g>
<g transform="translate(930 710)">
  <rect x="0" y="58" width="125" height="16" rx="3" fill="#684B31"/>
  <rect x="10" y="6" width="50" height="53" rx="3" fill="#A98F68"/>
  <rect x="64" y="0" width="51" height="59" rx="3" fill="#806747"/>
</g>

<!-- wet pavement reflections -->
<g opacity=".22">
  <path d="M455 704H810" stroke="#B8D4E8" stroke-width="9" stroke-linecap="round"/>
  <path d="M480 726H770" stroke="#B8D4E8" stroke-width="5" stroke-linecap="round"/>
  <path d="M840 685H1030" stroke="#E9C17A" stroke-width="7" stroke-linecap="round"/>
  <path d="M130 650H350" stroke="#B8D4E8" stroke-width="5" stroke-linecap="round"/>
</g>

<!-- subtle motion / route marks -->
<g opacity=".2" stroke="#8FB1CD" stroke-width="2">
  <path d="M60 820H340"/><path d="M70 840H270"/><path d="M1010 650H1160"/>
</g>
</svg>